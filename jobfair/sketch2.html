<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(assets/PretendardVariable.woff2) format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:P,sans-serif;color:#fff;word-break:keep-all}
.L{position:absolute;inset:0;overflow:hidden}
.shot{position:absolute;inset:0;overflow:hidden;background:#000}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 48%,rgba(10,30,20,.85) 100%)}
.brand{position:absolute;left:72px;top:56px;font-weight:800;font-size:26px;letter-spacing:.06em;line-height:1.05}
.brand small{display:block;font-size:15px;font-weight:600;letter-spacing:.18em;opacity:.85;margin-top:6px}
.rec{position:absolute;right:72px;top:58px;font-size:20px;font-weight:600;letter-spacing:.12em;display:flex;align-items:center;gap:12px}
.rec i{width:14px;height:14px;border-radius:50%;background:#ff5a4a;display:block}
.cap{position:absolute;left:72px;bottom:84px}
.chip{display:inline-block;font-size:22px;font-weight:800;letter-spacing:.14em;padding:9px 18px;border-radius:8px;margin-bottom:20px}
.head{font-size:84px;font-weight:850;line-height:1.08;letter-spacing:-.02em;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.sub{font-size:34px;font-weight:600;margin-top:20px;opacity:.95}
.sub b{font-weight:850}
.tag{position:absolute;right:72px;bottom:90px;font-size:22px;font-weight:600;padding:10px 20px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
.prog{position:absolute;left:72px;right:72px;top:118px;height:4px;display:flex;gap:6px}
.prog span{flex:1;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.prog span i{display:block;height:100%;background:#fff;transform-origin:left}
.wipe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.wipe .n{font-size:220px;font-weight:900;line-height:.9;letter-spacing:-.04em}
.wipe .t{font-size:56px;font-weight:800;margin-top:18px}
.green{background:#22553a}
.cream{background:#f7f2e2;color:#1d4a32}
.bar{position:absolute;left:0;right:0;bottom:0;height:16px;display:flex}
.bar span{flex:1}
.cards{position:absolute;left:96px;right:96px;top:380px;display:flex;gap:32px}
.card{flex:1;border-radius:28px;padding:44px 40px 40px;color:#fff;height:440px;display:flex;flex-direction:column;justify-content:space-between}
.card .k{font-size:30px;font-weight:700;opacity:.95}
.card .v{font-size:118px;font-weight:900;letter-spacing:-.04em;line-height:1}
.card .v small{font-size:44px;font-weight:800;margin-left:6px;letter-spacing:0}
.card .d{font-size:22px;font-weight:600;opacity:.9;line-height:1.4}
</style></head><body>
<div id="root"></div>
<script src="intro.js"></script>
<script>
const C={blue:'#2f6fd6',red:'#e5483f',purple:'#7b45d1',yellow:'#efa52c',green:'#22553a',orange:'#ef6a3a',teal:'#1f9c8a'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const root=document.getElementById('root');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;root.appendChild(e);return e};
const parts=[];
function add(s,e,html,fn){const n=el(html);parts.push({s,e,n,fn});return n}

buildIntro(1.5);

/* ---------- CHAPTERS 6-48 : 6 x 7s, 1 photo per second ---------- */
const CH=[
 {c:C.teal,  name:'11.10 전날 홍보', head:'하루 전부터 시작된 잡페어', sub:'11.10 캠퍼스 홍보 부스 · 사전등록 <b>572명</b>',
  ph:[['0211','11.10 전날 · 홍보 부스'],['0214','11.10 전날 · 팝콘 나눔 홍보']]},
 {c:C.red,   name:'11.11 당일 · 입장', head:'문 열기 전부터 이어진 줄', sub:'현장등록 <b>669명</b> · 총 <b>1,090명</b>',
  ph:[['0289','11.11 당일 · 체육관 앞 대기 줄'],['0301','QR 현장등록']]},
 {c:C.blue,  name:'행사장 전경', head:'6개 존, 55개 부스', sub:'기업 · 기관 <b>48</b> · 체험 <b>7</b>',
  ph:[['0330','행사장 전경'],['0340','C01 LG그룹 IT계열사']]},
 {c:C.purple,name:'기업 상담', head:'현직자와 마주 앉은 1:1 상담', sub:'참여기업 <b>35곳</b> · 상담 <b>1,713건</b>',
  ph:[['6333','현직자 1:1 상담'],['0346','현직자 상담']]},
 {c:C.yellow,name:'기관 · 이벤트관', head:'기관 상담부터 취업 준비 체험까지', sub:'D존 유관기관 <b>7</b> · E존 교내기관 <b>6</b> · F존 이벤트관 <b>7</b>',
  ph:[['0328','D07 대한민국 공군'],['0336','헤어 · 메이크업 · 이력서 사진']]},
 {c:C.orange,name:'이벤트 · 경품 · 푸드트럭', head:'끝까지 즐거웠던 하루', sub:'이벤트 참여 <b>227건</b> · 경품 추첨 2회 · 당첨 <b>19명</b>',
  ph:[['0344','푸드트럭'],['2304','경품 추첨 현장']]},
];
const CS=9, CT=33, PD=CT/CH.reduce((n,c)=>n+c.ph.length,0);
let acc=CS; CH.forEach(c=>{c.S=acc;c.L=c.ph.length*PD;acc+=c.L});
CH.forEach((ch,ci)=>{
  const S=ch.S, CL=ch.L;
  ch.ph.forEach(([id,lbl],pi)=>{
    const s=S+pi*PD, e=s+PD, mode=(ci*7+pi)%4, dir=(pi%2)?1:-1;
    add(s,e+0.3,`<div class="shot"><img src="assets/d/${id}.jpg"><div class="shade"></div><div class="tag">${lbl}</div></div>`,(n,t)=>{
      const k=t/(PD+.3), img=n.querySelector('img');
      img.style.transform=`scale(${1.14-.08*k}) translateX(${dir*(k-.5)*40}px)`;
      const w=eo(t/0.5);
      if(pi==0) n.style.clipPath='none';
      else if(mode==0) n.style.clipPath=`inset(0 0 0 ${(1-w)*100}%)`;
      else if(mode==1) n.style.clipPath=`inset(0 ${(1-w)*100}% 0 0)`;
      else if(mode==2) n.style.clipPath=`inset(${(1-w)*100}% 0 0 0)`;
      else n.style.clipPath=`circle(${w*80}% at 50% 50%)`;
      const tg=n.querySelector('.tag');tg.style.opacity=clamp((t-.2)/.2);tg.style.transform=`translateX(${(1-eo((t-.2)/.35))*40}px)`;
    });
  });
  add(S,S+CL,`<div class="L">
    <div class="brand">GLOCAL JOB FAIR<small>2026 · 건국대학교 GLOCAL캠퍼스</small></div>
    <div class="rec"><i></i>SKETCH 0${ci+1} / 0${CH.length}</div>
    <div class="prog">${ch.ph.map(()=>'<span><i></i></span>').join('')}</div>
    <div class="cap"><div class="chip" style="background:${ch.c}">SKETCH 0${ci+1} · ${ch.name}</div>
      <div class="head">${ch.head}</div><div class="sub">${ch.sub}</div></div></div>`,(n,t)=>{
    const out=clamp((CL-t)/.3);
    n.querySelector('.rec i').style.opacity=(Math.floor(t*2)%2)?.3:1;
    n.querySelectorAll('.prog i').forEach((b,i)=>b.style.transform=`scaleX(${clamp((t-i*PD)/PD)})`);
    n.querySelector('.prog').style.opacity=out;
    const chip=n.querySelector('.chip'),hd=n.querySelector('.head'),sb=n.querySelector('.sub');
    chip.style.opacity=clamp((t-.5)/.25)*out;chip.style.transform=`translateX(${(1-eo((t-.5)/.4))*-60}px)`;
    hd.style.opacity=clamp((t-.65)/.3)*out;hd.style.transform=`translateY(${(1-eo((t-.65)/.5))*40}px)`;
    sb.style.opacity=clamp((t-.95)/.3)*out;sb.style.transform=`translateY(${(1-eo((t-.95)/.5))*30}px)`;
  });
  add(S-0.45,S+0.55,`<div class="wipe" style="background:${ch.c}"><div class="n">0${ci+1}</div><div class="t">${ch.name}</div></div>`,(n,t)=>{
    const a=eio(t/0.4),b=eio((t-.6)/.4);
    n.style.clipPath=`inset(0 ${(1-a)*100}% 0 ${b*100}%)`;
    n.firstChild.style.transform=`translateX(${(1-eo(t/.5))*120-eo((t-.6)/.4)*120}px)`;
  });
});

/* ---------- STATS 48-54 ---------- */
const ST=[{k:'총 참여 인원',v:1090,f:0,u:'명',d:'사전등록 후 현장 303 · 현장등록 669 · 현장 서명 118',c:C.blue},
 {k:'부스 참여',v:1940,f:0,u:'건',d:'부스 QR 참여 기준 · 참여자 796명, 1인 평균 2.4곳',c:C.red},
 {k:'행사 전체 만족도',v:4.58,f:2,u:'점',d:'5점 척도 · 응답 462건 · 만족 이상 90.3%',c:C.purple},
 {k:'추천 의향',v:97.0,f:1,u:'%',d:'응답 462건 중 448건 “추천하겠다”',c:C.yellow}];
add(41.7,50.4,`<div class="L cream">
  <div style="position:absolute;left:96px;top:150px">
   <div class="ey" style="font-size:24px;font-weight:800;letter-spacing:.2em;color:${C.orange}">RESULT · 숫자로 본 글로컬 잡페어</div>
   <div class="tt" style="font-size:88px;font-weight:900;letter-spacing:-.03em;margin-top:18px">목표를 넘어선 하루</div></div>
  <div class="cards">${ST.map(s=>`<div class="card" style="background:${s.c}"><div class="k">${s.k}</div><div class="v"><span>0</span><small>${s.u}</small></div><div class="d">${s.d}</div></div>`).join('')}</div>
  <div style="position:absolute;left:96px;bottom:56px;font-size:20px;font-weight:600;opacity:.6">glocaljobfair.kr 등록 · 참여 · 만족도 조사 데이터 기준</div>
 </div>`,(n,t)=>{
  n.style.clipPath=`inset(${(1-eo(t/.45))*100}% 0 0 0)`;
  const ey=n.querySelector('.ey'),tt=n.querySelector('.tt');
  ey.style.opacity=clamp((t-.3)/.3);tt.style.opacity=clamp((t-.45)/.3);tt.style.transform=`translateY(${(1-eo((t-.45)/.5))*40}px)`;
  n.querySelectorAll('.card').forEach((c,i)=>{const s0=.7+i*.25,k=back((t-s0)/.6);
    c.style.transform=`translateY(${(1-k)*120}px)`;c.style.opacity=clamp((t-s0)/.25);
    const st=ST[i],x=eo((t-s0-.1)/1.5),v=st.v*x;
    c.querySelector('.v span').textContent=st.f?v.toFixed(st.f):Math.round(v).toLocaleString('en-US');});
});

/* ---------- OUTRO 50-60 ---------- */
buildOutro(50,10);

buildGrain();

window.setTime=function(T){
  parts.forEach((p,i)=>{const on=T>=p.s&&T<p.e;p.n.style.display=on?'':'none';p.n.style.zIndex=i;if(on)p.fn(p.n,T-p.s)});
};
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>{setTime(0);window.READY=1});
</script></body></html>
